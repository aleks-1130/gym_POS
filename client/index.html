<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#F97316" />
    <meta name="description" content="POS GYM - Progressive Web App for gym POS, management, and tracking" />
    
    <!-- Emergency SW Cleanup: Breaks infinite reload loops -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Emergency Reset: Unregistered a Service Worker to stop reload loop.');
          }
          if (registrations.length > 0) {
            // One final reload to clear the SW interception
            setTimeout(() => window.location.reload(), 500); 
          }
        });
      }
      // Also clear any stuck PWA flags in session storage
      sessionStorage.removeItem('pwa-auto-reloaded');
    </script>

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="POS GYM" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="shortcut icon" href="/pwa-192x192.png" type="image/png" />
    
    <!-- Mobile Optimizations -->
    <meta name="color-scheme" content="dark light" />
    <meta name="supported-color-schemes" content="dark light" />
    
    <title>FitOS - Gym Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
